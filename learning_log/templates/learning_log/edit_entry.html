{% extends "learning_log/base.html" %}
{% load django_bootstrap5 %}

{% block page_header %}
<a href="{% url "learning_log:topics" topic.id %}" class="nav-link">{{ topic }}</a>
<h4>Edit Entry</h4>
{% endblock page_header %}
{% block content %}
<form action="{% url "learning_log:edit_entry" entry.id %}" method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% bootstrap_button button_type="submit" content="Save entry" %}
</form>

{% endblock content %}
