application:
name: "ll_project"
type: "python:3.12.7"


relationships:
    database: "db:postgresql"

# The configuration of app when it's expose to web.
web:
  upstream:
    socket_family: unix
  command:
    start: "gonicorn -w 4 -b unix:$SOCKET ll_project.wsgi:application"
  locations:
    "/":
        passthru: true
    "/static":
              root: "static"
              expires: 1h
              allow: true
# The size of the persistent disk of application (in MB)
disk: 512


# Set a local read/write mount of logs
mounts:
  "logs":
    source: local
    source_path: logs

# The hooks executed various point of the lifecycle ot the application.
hooks:
  build: |
    pip install --upgrade pip
    pip install -r requirement.txt
    pip install -r requirement_remote.txt

    mkdir logs
    python manage.py collecttatic
    rm -rf logs
  deploy: |
    python manage.py migrate



